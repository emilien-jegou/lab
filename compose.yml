services:
  # ============================================================================
  # 1. TLS Cert Generator (Runs once in 0.1s, exits 0)
  # ============================================================================
  kanidm-certs:
    image: docker.io/alpine/openssl:latest
    container_name: kanidm-certs
    restart: "no"
    volumes:
      - ./__internal/kanidm/certs:/certs:z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /certs/chain.pem ]; then
          echo "Generating internal self-signed certs..."
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /certs/key.pem \
            -out /certs/chain.pem \
            -days 3650 -subj "/CN=idm.localhost"
        fi

  kanidm:
    image: docker.io/kanidm/server:latest
    container_name: kanidm
    restart: unless-stopped
    command: ["kanidmd", "server", "-c", "/etc/kanidm/server.toml"] # <-- FULL BINARY CALL
    env_file:
      - env/kanidm.env
    depends_on:
      kanidm-certs:
        condition: service_completed_successfully
    volumes:
      - ./conf/kanidm/server.toml:/etc/kanidm/server.toml:ro,z
      - ./__internal/kanidm/certs:/certs:ro,z
      - ./__internal/kanidm/data:/data:z
    expose:
      - 8443
    healthcheck:
      test: ["CMD", "/usr/bin/kanidm", "ping", "-H", "https://127.0.0.1:8443", "-k"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  pingora-portal:
    image: docker.io/vicanso/pingap:latest
    container_name: pingora-portal
    restart: unless-stopped
    ports:
      - "8000:80"     # Main Unified Portal
      - "3018:3018"   # Pingora Web Admin UI
    command: >
      pingap -c /etc/pingap/conf
      --autoreload
      --admin=cGluZ2FwOjEyMzEyMw==@0.0.0.0:3018
    volumes:
      - ./conf/pingap:/etc/pingap/conf:ro,z
      - ./__internal/pingap:/opt/pingap:z
    depends_on:
      - lab
      - surrealist
      - openobserve
      - oxicloud
      - imgproxy
      - kanidm

  lab:
    image: docker.io/oven/bun:latest
    container_name: lab
    working_dir: /app
    env_file:
      - env/lab.env
      - env/db.lab.env
    depends_on:
      openobserve:
        condition: service_started
      vector:
        condition: service_started
      surrealdb:
        condition: service_started
      iggy:
        condition: service_started
      valkey:
        condition: service_started
      garage:
        condition: service_started
      imgproxy:
        condition: service_started
      oxicloud:
        condition: service_started
    ports:
      - "6605:3000"
    expose:
      - 3000
    volumes:
      - ./lab/:/app:z
      - ./data/:/data:z
    command: bash -c "bun run dev"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  iggy:
    image: apache/iggy:0.9.0-edge.8
    container_name: iggy
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    env_file:
      - env/iggy.env
    ports:
      - "6606:3000"
      - "8090:8090"
    volumes:
      - ./__internal/iggy:/app/local_data:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3000' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    env_file:
      - env/openobserve.env
    expose:
      - 5080
    volumes:
      - ./__internal/openobserve:/data:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 256M

  vector:
    image: docker.io/timberio/vector:nightly-alpine
    container_name: vector
    ports:
      - "8686:8686"
      - "8688:8688"
      - "4317:4317"
      - "4318:4318"
    env_file:
      - env/vector.env
    volumes:
      - ./conf/vector/vector.yaml:/etc/vector/vector.yaml:ro,z
      - ./__internal/vector:/var/lib/vector:z
    command: ["--config", "/etc/vector/vector.yaml"]

  valkey:
    image: docker.io/valkey/valkey-bundle:latest
    container_name: valkey
    env_file:
      - env/valkey.env
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - ./__internal/valkey:/data:z
    command: >
      sh -c "valkey-server
      --requirepass $$VALKEY_PASSWORD
      --maxmemory 150mb
      --maxmemory-policy allkeys-lru"
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a $$VALKEY_PASSWORD ping | grep PONG"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

  surrealist:
    container_name: "surrealist"
    image: docker.io/surrealdb/surrealist:latest
    expose:
      - 8080
    restart: always
    depends_on:
      - surrealdb

  surrealdb:
    container_name: "surrealdb"
    image: localhost/lab_surrealdb:latest
    build:
      context: ./conf/surrealdb
      dockerfile: Dockerfile
    secrets:
      - surrealdb_root_pass
      - surrealdb_backend_user_pass
    ports:
      - "6800:6800"
      - "8200:8000"
    healthcheck:
      interval: 10s
      retries: 10
      test: ["CMD-SHELL", "curl -sSf http://localhost:6800/health || exit 1"]
      timeout: 2s
    restart: always
    volumes:
      - "./__internal/surrealdb:/surrealdb/data:z"

  garage:
    image: docker.io/dxflrs/garage:v2.3.0
    container_name: garage
    env_file:
      - env/garage.env
    command: /garage server --single-node --default-bucket
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # S3 Web
      - "3903:3903" # Admin API
    volumes:
      - ./conf/garage/garage.toml:/etc/garage.toml:ro,z
      - ./__internal/garage/meta:/var/lib/garage/meta:z
      - ./__internal/garage/data:/var/lib/garage/data:z
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  imgproxy:
    image: docker.io/darthsim/imgproxy:latest
    container_name: imgproxy
    restart: unless-stopped
    expose:
      - 8080
    depends_on:
      garage:
        condition: service_started
    env_file:
      - env/imgproxy.env
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 3s
      retries: 3

  oxicloud-db:
    image: docker.io/library/postgres:17-alpine
    container_name: oxicloud-db
    restart: unless-stopped
    env_file:
      - env/oxicloud-db.env
    volumes:
      - ./__internal/oxicloud-db:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxicloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  oxicloud:
    image: docker.io/diocrafts/oxicloud:latest
    container_name: oxicloud
    restart: unless-stopped
    expose:
      - 8086
    depends_on:
      oxicloud-db:
        condition: service_healthy
      garage:
        condition: service_started
    env_file:
      - env/oxicloud.env
    volumes:
      - ./__internal/oxicloud:/app/storage:z
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

secrets:
  surrealdb_root_pass:
    file: "conf/surrealdb/surrealdb_root_pass.txt"
  surrealdb_backend_user_pass:
    file: "conf/surrealdb/surrealdb_backend_user_pass.txt"
